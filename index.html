<div class="modal-bg" id="resetPasswordModal">
  <div class="modal">
    <h3 style="text-align:center;">Set a new password 🔑</h3>
    <p style="text-align:center;">Choose a new password for your Fluxxbank account.</p>
    <form onsubmit="event.preventDefault(); submitNewPassword();">
      <input type="password" id="newPass1" placeholder="New password" required>
      <input type="password" id="newPass2" placeholder="Confirm new password" required>
      <div class="error" id="newPassErr"></div>
      <button class="btn" id="newPassBtn" type="submit">Update password</button>
    </form>
  </div>
</div>
