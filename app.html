  <script>
    const SUPABASE_URL = "https://jthmxuecjbyvltvjfhyj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_JvS9Ga79l_ddco3i8GSjNQ_J6NFuW0L";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const eur = n => "€" + Number(n).toLocaleString("en-IE",{minimumFractionDigits:2,maximumFractionDigits:2});
    let currentBalance = 0;

    // --- CHECK IF USER IS HERE TO RESET PASSWORD ---
    async function checkPasswordReset() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('reset') === 'true') {
        // Show a prompt to update password
        const newPassword = prompt("Please enter your new password (min 6 characters):");
        if (newPassword && newPassword.length >= 6) {
          const { error } = await sb.auth.updateUser({ password: newPassword });
          if (error) {
            alert("Error updating password: " + error.message);
          } else {
            alert("✅ Password updated successfully! You can now use the app.");
            // Remove the '?reset=true' from the URL
            window.history.replaceState({}, document.title, window.location.pathname);
          }
        } else if (newPassword !== null) {
          alert("Password must be at least 6 characters.");
        }
      }
    }

    // Load data on page start
    async function init() {
      // Run the reset check first
      await checkPasswordReset();

      const { data: { session } } = await sb.auth.getSession();
      
      if (!session) { 
        window.location.href = "index.html"; 
        return; 
      }

      const { data: profile } = await sb.from("profiles").select("name, balance").eq("id", session.user.id).single();
      if (profile) {
        const firstName = profile.name ? profile.name.split(" ")[0] : "Customer";
        document.getElementById("userName").textContent = firstName;
        document.getElementById("userInitial").textContent = firstName[0].toUpperCase();
        document.getElementById("userNameCard").textContent = profile.name ? profile.name.toUpperCase() : "USER";
        document.getElementById("mainBalance").textContent = eur(profile.balance);
        currentBalance = profile.balance;
      }

      loadTransactions(session.user.id);
    }

    // ... KEEP the rest of your functions exactly the same ...
    async function loadTransactions(userId) {
      const { data: txs } = await sb.from("transactions").select("*").eq("user_id", userId).order("created_at", { ascending: false }).limit(5);
      const list = document.getElementById("txList");
      
      if (!txs || txs.length === 0) {
        list.innerHTML = '<div style="color:var(--mut);font-size:0.9rem;">No recent activity.</div>';
        return;
      }

      list.innerHTML = txs.map(t => {
        const isIncoming = t.type === 'deposit';
        return `
          <div class="tx-item">
            <div class="tx-info">
              <h4>${t.description}</h4>
              <p>${new Date(t.created_at).toLocaleDateString()}</p>
            </div>
            <div class="tx-amount ${isIncoming ? 'tx-in' : 'tx-out'}">
              ${isIncoming ? '+' : '−'}${eur(t.amount)}
            </div>
          </div>
        `;
      }).join("");
    }

    async function handleSend(e) {
      e.preventDefault();
      const to = document.getElementById("sendTo").value;
      const amt = parseFloat(document.getElementById("sendAmt").value);
      const msg = document.getElementById("sendMsg");
      
      if (amt > currentBalance) {
        msg.className = "msg error";
        msg.textContent = "Insufficient funds.";
        return false;
      }

      const { data: { session } } = await sb.auth.getSession();
      
      const newBal = currentBalance - amt;
      const { error: err1 } = await sb.from("profiles").update({ balance: newBal }).eq("id", session.user.id);
      
      if (err1) {
        msg.className = "msg error";
        msg.textContent = "Error: " + err1.message;
        return false;
      }

      await sb.from("transactions").insert({
        user_id: session.user.id,
        type: 'transfer',
        amount: amt,
        description: `Sent to ${to}`
      });

      currentBalance = newBal;
      document.getElementById("mainBalance").textContent = eur(newBal);
      document.getElementById("sendAmt").value = "";
      
      msg.className = "msg success";
      msg.textContent = `Successfully sent ${eur(amt)} to ${to}`;
      
      loadTransactions(session.user.id); 
      return false;
    }

    async function doLogout() {
      await sb.auth.signOut();
      window.location.href = "index.html";
    }

    init();
  </script>
