<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluxxbank | Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F4F6; 
    --sidebar-bg: #FFFFFF;
    --card-bg: #FFFFFF;
    --text-main: #111827;
    --text-muted: #6B7280;
    --border: #E5E7EB;
    --accent: #4F46E5; /* Indigo blue from image */
    --success-bg: #D1FAE5; --success-text: #065F46;
    --warning-bg: #FEF3C7; --warning-text: #92400E;
    --purple-bg: #F3E8FF; --purple-text: #6B21A8;
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
  body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; }

  /* --- SIDEBAR --- */
  .sidebar {
    width: 80px; background: var(--sidebar-bg); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; padding: 24px 0; gap: 30px;
  }
  .logo-icon { width: 40px; height: 40px; background: var(--accent); border-radius: 12px; display: grid; place-items: center; color: white; margin-bottom: 20px; }
  .nav-icon { width: 24px; height: 24px; stroke: var(--text-muted); fill: none; stroke-width: 2; cursor: pointer; transition: stroke 0.2s; }
  .nav-icon:hover, .nav-icon.active { stroke: var(--accent); }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: #E5E7EB; display: grid; place-items: center; font-weight: 600; font-size: 0.8rem; color: var(--text-main); margin-top: auto; }

  /* --- MAIN AREA --- */
  .main { flex: 1; padding: 30px 40px; max-width: 1200px; margin: 0 auto; }
  .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
  .brand { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .brand svg { width: 24px; height: 24px; fill: var(--accent); }
  .header-actions { display: flex; align-items: center; gap: 16px; }
  .header-actions .avatar { margin-top: 0; background: #D1D5DB; }

  /* --- GRID LAYOUT --- */
  .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }

  /* --- BLUE BALANCE CARD --- */
  .balance-card {
    background: linear-gradient(135deg, #4F46E5 0%, #3B82F6 100%);
    border-radius: 20px; padding: 24px; color: white; position: relative; overflow: hidden;
  }
  .balance-card h3 { font-size: 0.9rem; opacity: 0.9; margin-bottom: 8px; font-weight: 500; }
  .balance-amount { font-size: 2.5rem; font-weight: 700; letter-spacing: -1px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  /* SVG Sparkline */
  .chart-svg { position: absolute; bottom: 20px; right: 20px; width: 120px; height: 60px; opacity: 0.8; }

  /* --- STAT CARDS --- */
  .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  .stat-card { background: var(--card-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--border); }
  .stat-title { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
  .stat-value { font-size: 1.5rem; font-weight: 700; }

  /* --- TRANSACTIONS TABLE --- */
  .section-header { display: flex; justify-content: space-between; align-items: center; margin: 30px 0 16px; }
  .section-header h2 { font-size: 1.1rem; font-weight: 600; }
  .card { background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); padding: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 10px 0; color: var(--text-muted); font-size: 0.8rem; font-weight: 500; border-bottom: 1px solid var(--border); }
  td { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; font-weight: 500; }
  tr:last-child td { border-bottom: none; }
  
  /* Status Pills */
  .pill { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; display: inline-block; }
  .pill.success { background: var(--success-bg); color: var(--success-text); }
  .pill.warning { background: var(--warning-bg); color: var(--warning-text); }
  .pill.purple { background: var(--purple-bg); color: var(--purple-text); }

  .btn-receipt { 
    background: var(--accent); color: white; border: none; padding: 12px 20px; 
    border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 20px;
    transition: background 0.2s;
  }
  .btn-receipt:hover { background: #4338CA; }

  /* --- RECEIPT DISPLAY (Right side of image) --- */
  .receipt-panel { background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); padding: 30px; position: relative; }
  .receipt-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 20px; }
  .receipt-dots div { width: 8px; height: 8px; border-radius: 50%; background: #E5E7EB; }
  
  .receipt-content { text-align: center; font-family: monospace; }
  .receipt-logo { display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Inter', sans-serif; font-size: 1.4rem; font-weight: 700; margin-bottom: 24px; }
  .receipt-logo svg { width: 24px; height: 24px; fill: var(--accent); }
  .receipt-divider { border-top: 1px dashed var(--border); margin: 20px 0; }
  .receipt-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.9rem; color: var(--text-muted); }
  .receipt-row span:last-child { color: var(--text-main); font-weight: 600; }
  .barcode { width: 100%; height: 50px; background: repeating-linear-gradient(90deg, #111827 0, #111827 2px, transparent 2px, transparent 4px, #111827 4px, #111827 6px, transparent 6px, transparent 10px); margin-top: 30px; opacity: 0.8; }
  
  @media(max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>
    </div>
    <svg class="nav-icon active" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <svg class="nav-icon" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <div class="avatar" id="userInitial" onclick="doLogout()">U</div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">
    <div class="top-header">
      <div class="brand">
        <svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>
        Fluxxbank
      </div>
      <div class="header-actions">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <div class="avatar" id="headerAvatar">U</div>
      </div>
    </div>

    <div class="dashboard-grid">
      
      <!-- LEFT COLUMN -->
      <div>
        <!-- Blue Balance Card -->
        <div class="balance-card">
          <h3>Total Balance</h3>
          <div class="balance-amount" id="mainBalance">$0.00</div>
          <!-- SVG Chart Line -->
          <svg class="chart-svg" viewBox="0 0 100 40" preserveAspectRatio="none">
            <path d="M0 30 Q 10 20, 20 25 T 40 10 T 60 20 T 80 5 T 100 15" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" />
          </svg>
        </div>

        <!-- Stat Row -->
        <div class="stat-row">
          <div class="stat-card">
            <div class="stat-title">Available Balance</div>
            <div class="stat-value" id="availBalance">$0.00</div>
          </div>
          <div class="stat-card">
            <div class="stat-title">Pending Deposits</div>
            <div class="stat-value" id="pendingDeposits">$0.00</div>
          </div>
        </div>

        <!-- Recent Transactions -->
        <div class="section-header">
          <h2>Recent Transactions</h2>
          <svg class="nav-icon" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
        </div>
        
        <div class="card">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Amount</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="txBody">
              <!-- Transactions injected here -->
            </tbody>
          </table>
          <button class="btn-receipt" onclick="showReceipt()">Generate Receipt</button>
        </div>
      </div>

      <!-- RIGHT COLUMN (Receipt View) -->
      <div class="receipt-panel" id="receiptPanel">
        <div class="receipt-dots">
          <div></div><div></div><div></div><div></div><div></div>
        </div>
        
        <div class="receipt-content">
          <h2 class="receipt-logo">
            <svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>
            Fluxxbank
          </h2>
          <h3 style="font-size: 1.2rem; font-family: 'Inter', sans-serif; margin-bottom: 30px;">OFFICIAL RECEIPT</h3>
          
          <div class="receipt-divider"></div>
          
          <div class="receipt-row">
            <span>Date:</span>
            <span id="rcDate">[DATE]</span>
          </div>
          <div class="receipt-row">
            <span>Description:</span>
            <span id="rcDesc">[DESCRIPTION]</span>
          </div>
          <div class="receipt-row">
            <span>Amount:</span>
            <span id="rcAmt">[AMOUNT]</span>
          </div>
          
          <div class="receipt-divider"></div>
          
          <div class="receipt-row" style="text-align: left;">
            <span>Transaction ID:</span>
            <span id="rcId" style="font-size: 0.8rem;">FLX-000000</span>
          </div>
          
          <div class="barcode"></div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://jthmxuecjbyvltvjfhyj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_JvS9Ga79l_ddco3i8GSjNQ_J6NFuW0L";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const usd = n => "$" + Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
    let currentBalance = 0;
    let latestTx = null;

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = "index.html"; return; }

      const { data: profile } = await sb.from("profiles").select("name, balance").eq("id", session.user.id).single();
      if (profile) {
        const firstName = profile.name ? profile.name.split(" ")[0] : "Customer";
        document.getElementById("userInitial").textContent = firstName[0].toUpperCase();
        document.getElementById("headerAvatar").textContent = firstName[0].toUpperCase();
        
        document.getElementById("mainBalance").textContent = usd(profile.balance);
        document.getElementById("availBalance").textContent = usd(profile.balance);
        currentBalance = profile.balance;
      }

      loadTransactions(session.user.id);
    }

    async function loadTransactions(userId) {
      const { data: txs } = await sb.from("transactions").select("*").eq("user_id", userId).order("created_at", { ascending: false });
      const tbody = document.getElementById("txBody");
      
      if (!txs || txs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">No transactions found.</td></tr>';
        return;
      }

      // Set the latest transaction for the receipt
      latestTx = txs[0];

      tbody.innerHTML = txs.slice(0, 5).map((t, index) => {
        // Randomly assign status pills to match your image
        const pills = ['success', 'warning', 'purple'];
        const pillClass = pills[index % 3];
        const statusText = pillClass === 'success' ? 'Completed' : pillClass === 'warning' ? 'Pending' : 'Cleared';
        
        const dateObj = new Date(t.created_at);
        const dStr = dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        
        return `
          <tr>
            <td style="color:var(--text-muted)">${dStr}</td>
            <td>${t.description}</td>
            <td style="font-weight:600;">${usd(t.amount)}</td>
            <td><span class="pill ${pillClass}">${statusText}</span></td>
          </tr>
        `;
      }).join("");

      updateReceipt(latestTx);
    }

    function updateReceipt(tx) {
      if(!tx) return;
      const dateObj = new Date(tx.created_at);
      const dStr = dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      
      document.getElementById("rcDate").textContent = dStr;
      document.getElementById("rcDesc").textContent = tx.description;
      document.getElementById("rcAmt").textContent = usd(tx.amount);
      document.getElementById("rcId").textContent = tx.id.substring(0, 8).toUpperCase();
    }

    function showReceipt() {
      if(!latestTx) return alert("No transactions to generate a receipt for.");
      // Flash effect to draw attention to receipt panel
      const panel = document.getElementById("receiptPanel");
      panel.style.boxShadow = "0 0 20px rgba(79, 70, 229, 0.4)";
      setTimeout(() => { panel.style.boxShadow = "none"; }, 1000);
    }

    async function doLogout() {
      if(confirm("Do you want to log out?")) {
        await sb.auth.signOut();
        window.location.href = "index.html";
      }
    }

    init();
  </script>
</body>
</html>
