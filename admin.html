<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Fluxxbank — the digital bank that's always in motion. Free accounts, instant FluxxPay, 5.0 rated.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://fluxxbank.netlify.app/">
<meta property="og:title" content="Fluxxbank — Banking in Motion">
<meta property="og:description" content="Free accounts, instant payments, smart savings. Rated 5.0 by 310,000+ customers.">
<meta property="og:image" content="https://fluxxbank.netlify.app/og-cover.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Fluxxbank — Banking in Motion">
<meta name="twitter:image" content="https://fluxxbank.netlify.app/og-cover.png">
<meta name="theme-color" content="#0b1020">
<link rel="icon" type="image/png" href="favicon.png">
<title>Fluxxbank Admin Console</title>
<style>
  :root{
    --ink:#0b1020; --ink2:#111a36; --card:#151f42; --line:rgba(255,255,255,.08);
    --accent:#4f7cff; --accent2:#22d3ee; --gold:#f5c451; --ok:#34d399; --bad:#f87171; --warn:#fbbf24;
    --txt:#eef1fb; --mut:#8f9bc0;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",Inter,system-ui,sans-serif}
  body{background:var(--ink);color:var(--txt)}
  button{font:inherit;cursor:pointer;border:none}
  input,select{background:#0c1226;border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--txt);font-size:.88rem;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  ::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:#263058;border-radius:99px}
  #loginScreen{position:fixed;inset:0;z-index:100;display:grid;place-items:center;
      background:radial-gradient(700px 400px at 70% 20%,rgba(79,124,255,.2),transparent 60%),var(--ink)}
  .login-box{background:var(--ink2);border:1px solid var(--line);border-radius:20px;padding:40px;width:min(400px,92vw);text-align:center}
  .mark{width:54px;height:54px;border-radius:14px;margin:0 auto 18px;display:grid;place-items:center;
      background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 30px rgba(79,124,255,.5)}
  .mark svg{width:28px;height:28px}
  .login-box h1{font-size:1.4rem;margin-bottom:4px}
  .login-box .sub{color:var(--mut);font-size:.85rem;margin-bottom:26px}
  .login-box input{width:100%;margin-bottom:12px;padding:13px 16px}
  .btn{background:linear-gradient(135deg,var(--accent),#3b5bdb);color:#fff;font-weight:600;border-radius:11px;
      padding:12px 20px;box-shadow:0 6px 18px rgba(79,124,255,.35);transition:transform .15s}
  .btn:hover{transform:translateY(-2px)}
  .btn.full{width:100%}
  .btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--txt)}
  .btn.ok{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 4px 14px rgba(16,185,129,.3)}
  .btn.bad{background:linear-gradient(135deg,#ef4444,#b91c1c);box-shadow:0 4px 14px rgba(239,68,68,.3)}
  .btn.sm{padding:6px 12px;font-size:.78rem;border-radius:8px}
  .hint{margin-top:18px;font-size:.78rem;color:var(--mut);background:rgba(79,124,255,.07);border:1px dashed rgba(79,124,255,.3);
      border-radius:10px;padding:10px}
  .login-err{color:var(--bad);font-size:.83rem;min-height:18px;margin-bottom:10px}
  #app{display:none;min-height:100vh}
  #app.on{display:grid;grid-template-columns:230px 1fr}
  aside{background:var(--ink2);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
  aside .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;padding:0 10px 20px}
  .side-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;color:var(--mut);
      padding:12px 14px;border-radius:11px;font-size:.92rem;font-weight:500;transition:all .15s}
  .side-btn:hover{color:var(--txt);background:rgba(255,255,255,.04)}
  .side-btn.on{background:linear-gradient(135deg,rgba(79,124,255,.25),rgba(34,211,238,.12));color:#fff;border-left:3px solid var(--accent2)}
  aside .bottom{margin-top:auto;padding:0 10px}
  .admin-chip{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
  .admin-chip .av{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--gold),#e8a020);display:grid;place-items:center;font-weight:800;color:#241a02}
  .admin-chip small{color:var(--mut);display:block;font-size:.72rem}
  main{padding:26px 30px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:14px;flex-wrap:wrap}
  .topbar h2{font-size:1.35rem}
  .topbar .live{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--mut)}
  .pulse{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:p 1.6s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .kpi small{color:var(--mut);font-size:.78rem;text-transform:uppercase;letter-spacing:1px}
  .kpi b{font-size:1.55rem;display:block;margin-top:8px}
  .kpi .delta{font-size:.78rem;margin-top:6px;display:block}
  .up{color:var(--ok)} .dn{color:var(--bad)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
  .panel-head h3{font-size:1.02rem}
  .two{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}
  table{width:100%;border-collapse:collapse;font-size:.87rem}
  th{text-align:left;color:var(--mut);font-size:.72rem;text-transform:uppercase;letter-spacing:1px;padding:10px 12px;border-bottom:1px solid var(--line)}
  td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr{transition:background .15s}
  tbody tr:hover{background:rgba(255,255,255,.025)}
  .cust{display:flex;align-items:center;gap:10px}
  .cust .av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:.78rem;color:#fff}
  .cust small{display:block;color:var(--mut);font-size:.75rem}
  .pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.4px}
  .p-ok{background:rgba(52,211,153,.14);color:var(--ok)}
  .p-warn{background:rgba(251,191,36,.14);color:var(--warn)}
  .p-bad{background:rgba(248,113,113,.14);color:var(--bad)}
  .p-info{background:rgba(79,124,255,.14);color:var(--accent)}
  .mono{font-variant-numeric:tabular-nums}
  canvas{width:100%;height:240px}
  .feed-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.86rem}
  .feed-item:last-child{border:none}
  .feed-item .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:rgba(79,124,255,.14);flex:0 0 auto}
  .feed-item small{color:var(--mut);display:block;font-size:.75rem}
  .searchbar{display:flex;gap:10px;flex-wrap:wrap}
  .empty{color:var(--mut);text-align:center;padding:30px;font-size:.9rem}
  #toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent2);
      border-radius:12px;padding:14px 20px;font-size:.88rem;z-index:200;opacity:0;transform:translateY(12px);transition:all .3s;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  #toast.show{opacity:1;transform:translateY(0)}
  .view{display:none}
  .view.on{display:block}
</style>
</head>
<body>
<div id="loginScreen">
  <div class="login-box">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg></div>
    <h1>Fluxxbank Admin</h1>
    <div class="sub">Restricted area — authorized staff only</div>
    <input type="text" id="aUser" placeholder="Username" autocomplete="off">
    <input type="password" id="aPass" placeholder="Password">
    <div class="login-err" id="loginErr"></div>
    <button class="btn full" onclick="tryLogin()">Sign in →</button>
    <div class="hint">Demo credentials — user: <b>admin</b> · pass: <b>fluxx2026</b></div>
  </div>
</div>
<div id="app">
  <aside>
    <div class="logo">Fluxxbank Admin</div>
    <button class="side-btn on" onclick="nav('dash',this)">Overview</button>
    <button class="side-btn" onclick="nav('cust',this)">Customers</button>
    <button class="side-btn" onclick="nav('appr',this)">Approvals</button>
  </aside>
  <main>
    <div class="topbar"><h2 id="pageTitle">Overview</h2></div>
    <div class="view on" id="view-dash">
      <div class="kpis">
        <div class="kpi"><small>Total customers</small><b id="kCustomers">–</b></div>
        <div class="kpi"><small>Pending approvals</small><b id="kAppr">–</b></div>
      </div>
    </div>
    <div class="view" id="view-cust">
      <div class="panel">
        <div class="panel-head"><h3>Customer accounts</h3></div>
        <table>
          <thead><tr><th>Customer</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="custBody"></tbody>
        </table>
      </div>
    </div>
    <div class="view" id="view-appr">
      <div class="panel">
        <div class="panel-head"><h3>Pending applications</h3></div>
        <div id="apprList"></div>
      </div>
    </div>
  </main>
</div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://jthmxuecjbyvltvjfhyj.supabase.co";
const SUPABASE_KEY = "sb_publishable_JvS9Ga79l_ddco3i8GSjNQ_J6NFuW0L";
const ADMIN_USER = "admin", ADMIN_PASS = "fluxx2026";
let sb = (SUPABASE_KEY !== "PASTE_YOUR_KEY_HERE" && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

function tryLogin(){
  const u = document.getElementById("aUser").value.trim(), p = document.getElementById("aPass").value;
  if(u===ADMIN_USER && p===ADMIN_PASS){ sessionStorage.setItem("fluxx_admin","1"); boot(); }
  else document.getElementById("loginErr").textContent = "Invalid credentials.";
}
function logout(){ sessionStorage.removeItem("fluxx_admin"); location.reload(); }

async function loadAll(){
  if(!sb) return;
  const { data } = await sb.from("profiles").select("*").order("created_at",{ascending:false});
  if(data) window.customers = data;
}
function renderCustomers(){
  const rows = window.customers || [];
  document.getElementById("custBody").innerHTML = rows.map((c,i)=>`
    <tr>
      <td>${c.name}<br><small>${c.email}</small></td>
      <td>${c.status}</td>
      <td>${c.status==="Pending" ? `<button class="btn sm ok" onclick="approve(${i})">Approve</button>` : ""}</td>
    </tr>`).join("") || "<tr><td colspan='3'>No customers</td></tr>";
}
async function approve(i){
  const c = window.customers[i];
  await sb.from("profiles").update({ status: "Active" }).eq("id", c.id);
  c.status = "Active";
  renderCustomers();
  toast(c.name + " approved");
}
function nav(v, btn){
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
  document.getElementById("view-"+v).classList.add("on");
  document.querySelectorAll(".side-btn").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  document.getElementById("pageTitle").textContent = v === "dash" ? "Overview" : v === "cust" ? "Customers" : "Approvals";
  if(v==="cust") renderCustomers();
}
function toast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2500);
}
async function boot(){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").classList.add("on");
  await loadAll();
  renderCustomers();
}
if(sessionStorage.getItem("fluxx_admin")==="1") boot();
</script>
</body>
</html>
