<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FluxxBank Admin Console</title>
  <style>
    :root { --bg: #080e1c; --panel: #101a2e; --panel2: #15223b; --border: #263653; --text: #edf3ff; --muted: #98a8c2; --orange: #f58220; --green: #32c997; --red: #ff7070; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Arial, Helvetica, sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    #loginScreen { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: radial-gradient(ellipse at top, #192c4c 0%, var(--bg) 65%); }
    .login-box { width: 100%; max-width: 410px; padding: 32px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 20px 70px #0005; }
    .brand { color: var(--orange); font-size: 25px; font-weight: 800; letter-spacing: .3px; }
    .subtitle { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 9px 0 25px; }
    label { display: block; margin: 16px 0 7px; font-size: 13px; color: #c8d5e9; }
    input { width: 100%; padding: 13px; border: 1px solid var(--border); border-radius: 8px; background: #091222; color: white; outline: none; }
    input:focus { border-color: var(--orange); }
    .btn { border: 0; border-radius: 8px; padding: 11px 15px; font-weight: 700; background: var(--orange); color: #111827; }
    .full { width: 100%; margin-top: 20px; }
    .secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
    .small { padding: 7px 10px; font-size: 12px; }
    .error { color: var(--red); font-size: 13px; line-height: 1.5; margin-top: 12px; }
    .success { color: var(--green); }
    #app { min-height: 100vh; }
    .layout { display: grid; grid-template-columns: 235px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { background: #0b1425; border-right: 1px solid var(--border); padding: 25px 15px; }
    .sidebar .brand { padding: 0 10px 27px; font-size: 22px; }
    .side-label { padding: 12px 10px; color: var(--muted); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; }
    .side-btn { display: block; width: 100%; margin: 5px 0; padding: 12px; text-align: left; border: 1px solid transparent; border-radius: 8px; background: transparent; color: #b9c7dd; }
    .side-btn:hover, .side-btn.on { background: #172742; border-color: #293d5e; color: white; }
    .side-btn.on { box-shadow: inset 3px 0 var(--orange); }
    main { min-width: 0; }
    .topbar { min-height: 82px; padding: 20px 28px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: #0c1526; }
    .content { padding: 28px; }
    .view { display: none; }
    .view.on { display: block; }
    .panel { padding: 21px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 24px;}
    .panel h2 { margin: 0 0 17px; font-size: 16px; }
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    td small { display: block; margin-top: 5px; color: var(--muted); }
    .status { padding: 5px 8px; border-radius: 6px; background: #26344c; font-size: 11px; }
    .status.active { background: #103a32; color: #72e4bb; }
    .status.pending { background: #49341b; color: #ffd18c; }
    #toast { position: fixed; right: 20px; bottom: 20px; z-index: 5; padding: 13px 17px; border-radius: 9px; background: var(--panel2); color: white; }
  </style>
</head>
<body>
  <section id="loginScreen">
    <div class="login-box">
      <div class="brand">FluxxBank</div>
      <form id="loginForm">
        <label>Admin Email</label><input type="email" id="aEmail" required>
        <label>Password</label><input type="password" id="aPass" required>
        <div id="loginErr" class="error"></div>
        <button class="btn full" id="loginBtn" type="submit">Sign in</button>
      </form>
    </div>
  </section>

  <div id="app" class="hidden">
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">FluxxBank</div>
        <nav>
          <button class="side-btn on" data-view="cust" type="button">Customers</button>
          <button class="side-btn" data-view="appr" type="button">Approvals</button>
        </nav>
      </aside>
      <main>
        <header class="topbar"><h1>Admin</h1><button class="btn secondary" id="logoutBtn">Sign out</button></header>
        <div class="content">
          <section id="view-cust" class="view on">
            <div class="panel">
              <h2>Customer Accounts</h2>
              <div class="table-wrap"><table>
                <thead><tr><th>Customer</th><th>Status</th><th>Balance</th><th>Action</th></tr></thead>
                <tbody id="custBody"></tbody>
              </table></div>
            </div>
          </section>
          <section id="view-appr" class="view">
            <div class="panel"><h2>Pending Approvals</h2><div id="apprList"></div></div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <div id="toast" class="hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://jthmxuecjbyvltvjfhyj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_JvS9Ga79l_ddco3i8GSjNQ_J6NFuW0L";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let customers = [];
    const $ = id => document.getElementById(id);

    function toast(msg) { const el = $("toast"); el.textContent = msg; el.classList.remove("hidden"); setTimeout(() => el.classList.add("hidden"), 3500); }

    document.addEventListener("DOMContentLoaded", async () => {
      const { data } = await sb.auth.getSession();
      if (data.session) boot(); else $("loginScreen").classList.remove("hidden");

      $("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const { error } = await sb.auth.signInWithPassword({ email: $("aEmail").value, password: $("aPass").value });
        if (error) $("loginErr").textContent = error.message; else boot();
      });

      $("logoutBtn").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });

      document.querySelectorAll(".side-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".side-btn").forEach(b => b.classList.remove("on"));
          btn.classList.add("on");
          document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
          $("view-" + btn.dataset.view).classList.add("on");
        });
      });

      document.addEventListener("click", async (e) => {
        if (e.target.classList.contains("approve-btn")) {
          const index = e.target.getAttribute("data-index");
          await sb.from("profiles").update({ status: "active" }).eq("id", customers[index].id);
          toast("Customer Approved!"); loadData();
        }
      });
    });

    async function boot() {
      $("loginScreen").classList.add("hidden"); $("app").classList.remove("hidden");
      loadData();
    }

    async function loadData() {
      const { data } = await sb.from("profiles").select("*").order("created_at", { ascending: false });
      customers = data || [];
      renderCust(); renderAppr();
    }

    function renderCust() {
      $("custBody").innerHTML = customers.map((c, i) => {
        const sym = c.currency === 'USD' ? '$' : c.currency === 'GBP' ? '£' : '€';
        return `
        <tr>
          <td>${c.name}<small>${c.email}</small></td>
          <td><span class="status ${c.status.toLowerCase()}">${c.status}</span></td>
          <td style="font-weight:bold; color:var(--green);">${sym}${Number(c.balance || 0).toFixed(2)}</td>
          <td>
            ${c.status === 'Pending' ? `<button class="btn small approve-btn" data-index="${i}">Approve</button>` : ""}
            <button class="btn small" style="background:var(--orange); color:#000; margin-left:5px;" onclick="deposit('${c.id}', '${c.name}', '${c.currency || 'EUR'}')">+ Deposit</button>
          </td>
        </tr>`;
      }).join("");
    }

    function renderAppr() {
      const pending = customers.map((c, i) => ({ c, i })).filter(x => x.c.status === 'Pending');
      $("apprList").innerHTML = pending.map(({ c, i }) => `
        <div style="display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--border)">
          <div><strong>${c.name}</strong><div style="color:var(--muted);font-size:12px">${c.email}</div></div>
          <button class="btn small approve-btn" data-index="${i}">Approve</button>
        </div>`).join("") || '<div style="color:var(--muted)">No pending applications.</div>';
    }

    async function deposit(userId, userName, currency) {
      const amountStr = prompt(`Deposit amount for ${userName}:`);
      if (!amountStr) return;
      const amount = parseFloat(amountStr);
      if (isNaN(amount) || amount <= 0) return alert("Invalid amount");

      const { data: profile } = await sb.from("profiles").select("balance").eq("id", userId).single();
      const newBalance = Number(profile.balance || 0) + amount;

      // 1. Update Balance
      const { error: err1 } = await sb.from("profiles").update({ balance: newBalance }).eq("id", userId);
      if (err1) return toast("Error: " + err1.message);

      // 2. Create Professional Transaction
      const txRef = "DEP-" + Math.random().toString(36).substring(2, 8).toUpperCase();
      await sb.from("transactions").insert({ 
        user_id: userId, 
        reference: txRef,
        description: 'Admin Manual Deposit', 
        amount: amount, 
        currency: currency,
        type: 'deposit', 
        status: 'completed',
        account_name: 'Everyday Account',
        account_number: '•••• 4021',
        balance_after: newBalance
      });
      
      const sym = currency === 'USD' ? '$' : currency === 'GBP' ? '£' : '€';
      toast(`✅ Deposited ${sym}${amount} to ${userName}`);
      loadData();
    }
  </script>
</body>
</html>
